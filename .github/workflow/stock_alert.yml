name: iPhone Duo Apple HK Pickup Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub 排程非秒級即時；此設定約每五分鐘執行一次。
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: iphone-duo-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Check Apple pickup availability and notify Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check_stock.py

      - name: Persist last availability state
        if: always() && hashFiles('stock_state.json') != ''
        run: |
          if ! git diff --quiet -- stock_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock_state.json
            git commit -m "Update iPhone Duo stock state [skip ci]"
            git push
          fi
