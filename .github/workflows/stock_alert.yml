name: iPhone 18 Pro Max Stock Alert

on:
  schedule:
    # 每 5 分鐘自動啟動一次，配合 Python 腳本達到每 30 秒查一次
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_send:
        description: '是否強制發送 Telegram 測試通知（即使全港缺貨）'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run stock checker
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
        run: |
          python check_stock.py
